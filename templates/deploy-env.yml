# templates/deploy-env.yml - reused for dev, staging and prod
parameters:
  - name: envName
    type: string
  - name: adoEnvironment
    type: string
  - name: awsConnection       # per-environment AWS account / deploy role
    type: string
  - name: ecrConnection       # shared tools account that owns ECR
    type: string
  - name: dependsOn
    type: string
  - name: requiredTag         # ECR tag the image must already carry
    type: string
    default: ''
  - name: promoteTag          # ECR tag added after this env passes
    type: string

stages:
  # ------------------------------------------------------------ PLAN
  - stage: Plan_${{ parameters.envName }}
    displayName: Terraform plan (${{ parameters.envName }})
    dependsOn: ${{ parameters.dependsOn }}
    condition: and(succeeded(), eq(variables.isMain, 'true'))
    variables:
      - group: media-${{ parameters.envName }}   # TF_STATE_BUCKET, TF_LOCK_TABLE
    jobs:
      - job: Plan
        steps:
          - script: bash scripts/install-terraform.sh $(tfVersion)
            displayName: Install Terraform $(tfVersion)

          - task: AWSShellScript@1
            displayName: terraform init + plan
            inputs:
              awsCredentials: ${{ parameters.awsConnection }}
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                cd infra
                terraform init -input=false \
                  -backend-config="bucket=$(TF_STATE_BUCKET)" \
                  -backend-config="key=media/${{ parameters.envName }}/terraform.tfstate" \
                  -backend-config="region=$(AWS_REGION)" \
                  -backend-config="dynamodb_table=$(TF_LOCK_TABLE)" \
                  -backend-config="encrypt=true"
                terraform validate
                terraform plan -input=false -out=tfplan \
                  -var-file="envs/${{ parameters.envName }}.tfvars" \
                  -var="image_tag=$(imageTag)" \
                  -var="ecr_registry=$(ecrRegistry)"
                mkdir -p "$(Build.ArtifactStagingDirectory)/plan"
                cp tfplan "$(Build.ArtifactStagingDirectory)/plan/"
                terraform show -no-color tfplan > "$(Build.ArtifactStagingDirectory)/plan/tfplan.txt"

          - publish: $(Build.ArtifactStagingDirectory)/plan
            artifact: tfplan-${{ parameters.envName }}
            displayName: Publish plan (reviewers read tfplan.txt)

  # ---------------------------------------------------------- DEPLOY
  - stage: Deploy_${{ parameters.envName }}
    displayName: Deploy (${{ parameters.envName }})
    dependsOn: Plan_${{ parameters.envName }}
    condition: succeeded()
    variables:
      - group: media-${{ parameters.envName }}
    jobs:
      - deployment: Rollout
        displayName: Apply + immutable rollout
        environment: ${{ parameters.adoEnvironment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: tfplan-${{ parameters.envName }}

                # Promotion rule: refuse images that skipped the previous environment
                - ${{ if ne(parameters.requiredTag, '') }}:
                    - task: AWSShellScript@1
                      displayName: Verify image passed ${{ parameters.requiredTag }}
                      inputs:
                        awsCredentials: ${{ parameters.ecrConnection }}
                        regionName: $(AWS_REGION)
                        scriptType: inline
                        inlineScript: |
                          set -euo pipefail
                          NEED="${{ parameters.requiredTag }}-$(Build.BuildId)"
                          for svc in publishing-api streaming-api; do
                            aws ecr describe-images --repository-name "media/$svc" \
                              --image-ids imageTag="$NEED" > /dev/null || {
                              echo "##vso[task.logissue type=error]media/$svc has no tag $NEED"
                              exit 1; }
                            echo "media/$svc carries $NEED - OK to promote"
                          done

                - script: bash scripts/install-terraform.sh $(tfVersion)
                  displayName: Install Terraform

                - task: AWSShellScript@1
                  name: tf
                  displayName: terraform apply (reviewed plan)
                  inputs:
                    awsCredentials: ${{ parameters.awsConnection }}
                    regionName: $(AWS_REGION)
                    scriptType: inline
                    inlineScript: |
                      set -euo pipefail
                      cd infra
                      terraform init -input=false \
                        -backend-config="bucket=$(TF_STATE_BUCKET)" \
                        -backend-config="key=media/${{ parameters.envName }}/terraform.tfstate" \
                        -backend-config="region=$(AWS_REGION)" \
                        -backend-config="dynamodb_table=$(TF_LOCK_TABLE)" \
                        -backend-config="encrypt=true"
                      # Applying the saved plan: exactly what was reviewed, nothing else
                      terraform apply -input=false \
                        "$(Pipeline.Workspace)/tfplan-${{ parameters.envName }}/tfplan"
                      ALB=$(terraform output -raw alb_dns_name)
                      ASGS=$(terraform output -json asg_names | jq -r 'values | join(" ")')
                      echo "##vso[task.setvariable variable=albDns]$ALB"
                      echo "##vso[task.setvariable variable=asgNames]$ASGS"

                - task: AWSShellScript@1
                  displayName: Wait for instance refresh
                  inputs:
                    awsCredentials: ${{ parameters.awsConnection }}
                    regionName: $(AWS_REGION)
                    scriptType: filePath
                    filePath: scripts/wait-instance-refresh.sh
                    arguments: $(asgNames)

                - script: bash scripts/smoke-test.sh "http://$(albDns)" "$(imageTag)"
                  displayName: Post-deployment checks

                - task: AWSShellScript@1
                  displayName: Promote image (${{ parameters.promoteTag }})
                  inputs:
                    awsCredentials: ${{ parameters.ecrConnection }}
                    regionName: $(AWS_REGION)
                    scriptType: inline
                    inlineScript: |
                      set -euo pipefail
                      NEW="${{ parameters.promoteTag }}-$(Build.BuildId)"
                      for svc in publishing-api streaming-api; do
                        MANIFEST=$(aws ecr batch-get-image --repository-name "media/$svc" \
                          --image-ids imageTag=$(imageTag) \
                          --query 'images[0].imageManifest' --output text)
                        aws ecr put-image --repository-name "media/$svc" \
                          --image-tag "$NEW" --image-manifest "$MANIFEST" > /dev/null
                        echo "Tagged media/$svc:$(imageTag) as $NEW"
                      done
          on:
            failure:
              steps:
                - task: AWSShellScript@1
                  displayName: Roll back in-flight refresh
                  inputs:
                    awsCredentials: ${{ parameters.awsConnection }}
                    regionName: $(AWS_REGION)
                    scriptType: filePath
                    filePath: scripts/rollback.sh
                    arguments: media-${{ parameters.envName }}
